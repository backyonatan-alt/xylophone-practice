<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&amp;display=swap">
  <style>
    body { margin: 0; background: #faf7f1; font-family: 'Rubik', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3B5FA0; } a:hover { color: #2c4a80; }
  </style>
</helmet>
<div dir="rtl" style="width: 390px; min-height: 720px; background: #faf7f1; color: #2b2620; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 36px 22px">

  <div style="display: flex; flex-direction: column; gap: 6px; text-align: center">
    <div style="font-size: 22px; font-weight: 900">רגע לפני שמתחילים</div>
    <div style="font-size: 15px; color: #7d7466">האם הקסילופון שלכם נראה כך?</div>
  </div>

  <div style="background: #fff; border: 1px solid #e8e1d5; border-radius: 16px; padding: 20px 18px">
    <div dir="ltr" style="display: flex; gap: 4px; align-items: flex-end">
      <div style="flex: 1; height: 108px; background: #C13732; color: #fff; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 13px; font-weight: 700">דו</div>
      <div style="flex: 1; height: 102px; background: #EF8A3C; color: #4a2500; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 13px; font-weight: 700">רה</div>
      <div style="flex: 1; height: 96px; background: #F3C64B; color: #6b4e00; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 13px; font-weight: 700">מי</div>
      <div style="flex: 1; height: 90px; background: #AED262; color: #3d5012; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 13px; font-weight: 700">פה</div>
      <div style="flex: 1; height: 84px; background: #2E7D3C; color: #fff; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 13px; font-weight: 700">סול</div>
      <div style="flex: 1; height: 78px; background: #82CBEC; color: #123a52; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 13px; font-weight: 700">לה</div>
      <div style="flex: 1; height: 72px; background: #2C4A8F; color: #fff; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 13px; font-weight: 700">סי</div>
      <div style="flex: 1; height: 66px; background: #8B5FB0; color: #fff; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 13px; font-weight: 700">דו׳</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="background: #2b2620; color: #fff; border-radius: 14px; height: 64px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; cursor: pointer">כן, זה שלנו</div>
    <div style="background: #fff; color: #2b2620; border: 1px solid #e0d8c9; border-radius: 14px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; cursor: pointer">לא — נתאים את הצבעים</div>
    <div style="text-align: center; font-size: 12.5px; color: #8d8375">אפשר לשנות בכל רגע מתוך מסך השירים</div>
  </div>

</div>
</x-dc>
</body>
</html>
